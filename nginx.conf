# Hashashin nginx config — SPA routing + PWA-correct caching.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

  # MCP endpoint — the agent interface (Hermes etc). Proxies to the Supabase
  # edge function so clients get one clean, stable URL on our domain.
  # Variable + resolver so nginx re-resolves the upstream instead of pinning
  # the IP it saw at container start.
  location = /api/mcp {
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    set $mcp_upstream https://qpoqxagsvvdpyqvmfxkv.supabase.co;
    proxy_pass $mcp_upstream/functions/v1/mcp;
    proxy_ssl_server_name on;
    proxy_set_header Host qpoqxagsvvdpyqvmfxkv.supabase.co;
    proxy_http_version 1.1;
    proxy_read_timeout 60s;
    client_max_body_size 1m;
  }

  # Service worker + registration + manifest must NEVER be cached long —
  # they are how updates reach installed apps.
  location ~* ^/(sw\.js|registerSW\.js|manifest\.webmanifest)$ {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  # Hashed build assets are immutable
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Icons/textures: cache for a day
  location ~* \.(png|jpg|jpeg|svg|webp|ico)$ {
    add_header Cache-Control "public, max-age=86400";
  }

  # SPA fallback — index.html itself stays fresh
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }

  # Baseline security headers
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
}
